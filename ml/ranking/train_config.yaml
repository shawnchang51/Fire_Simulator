# Pairwise Ranking Model Configuration
# =====================================
# This YAML config can be used with:
#   python -m ml.ranking.run_training --mode train --config ml/ranking/train_config.yaml
#
# CLI arguments override values in this file.

# ===================
# Data Paths
# ===================
data_dir: combined_fast
floor_plans_dir: combined_fast/floor_plans
target_grid_size: [96, 128]

# ===================
# Grid Encoding
# ===================
num_grid_channels: 5  # wall, passable, doors, exits, valid_mask

# ===================
# CNN Encoder Architecture
# ===================
cnn_channels: [16, 32, 64]  # Channel dimensions for CNN layers
latent_dim: 8               # Dimension of latent vector (K) for interpretability

# ===================
# Scenario MLP Architecture
# ===================
scenario_input_dim: 4       # agent_count, num_fires, fire_spread_rate, fire_discovery_delay
scenario_hidden_dim: 8
scenario_output_dim: 8

# ===================
# Scoring Head Architecture
# ===================
scoring_hidden_dim: 16
dropout: 0.2

# ===================
# Loss Function
# ===================
loss_type: ranknet  # 'ranknet' or 'hinge'
margin: 0.1         # Margin for hinge loss
sigma: 1.0          # Scaling factor for RankNet logistic

# ===================
# Regularization
# ===================
l1_lambda: 0.005    # L1 regularization for latent sparsity
weight_decay: 0.0001  # L2 regularization (AdamW weight decay)

# ===================
# Training Hyperparameters
# ===================
batch_size: 128         # Number of pairs per batch
learning_rate: 0.001    # Initial learning rate
warmup_epochs: 5        # Number of warmup epochs
epochs: 100             # Maximum training epochs
early_stopping_patience: 15  # Patience for early stopping
num_workers: 16          # Number of data loading workers

# ===================
# Checkpoint and Logging
# ===================
checkpoint_dir: checkpoints/ranking
log_dir: logs/ranking

# ===================
# Reproducibility
# ===================
seed: 42

# ===================
# Data Augmentation
# ===================
augment_shift: true  # Random shift augmentation for training (avoid position bias)

# ===================
# Normalization Stats (optional, computed from training data if not provided)
# ===================
# scenario_means: [100.0, 2.0, 1.0, 10.0]
# scenario_stds: [50.0, 1.0, 0.5, 5.0]
