# Ranking V2 - Full Configuration
# All V2 features enabled: Cross-Attention, Hard Negative Mining, Auxiliary Tasks
#
# Usage: python -m ml.ranking_v2.run_training --mode train --config ml/ranking_v2/configs/full.yaml

# Data paths
data_dir: combined_721
floor_plans_dir: combined_721/floor_plans
target_grid_size: [96, 128]

# Grid encoding
num_grid_channels: 5

# CNN Encoder
cnn_channels: [32, 64, 128]
latent_dim: 64
use_residual: true

# Scenario MLP
scenario_input_dim: 4
scenario_hidden_dim: 64
scenario_output_dim: 32

# Scoring Head
scoring_hidden_dim: 64
scoring_num_layers: 3
use_layer_norm: true
dropout: 0.3

# V2: Cross-Attention
use_cross_attention: true
attention_heads: 4
attention_dim: 64
num_attention_layers: 2
attention_dropout: 0.1
use_attention_ffn: true

# V2: Hard Negative Mining
mining_strategy: curriculum  # none, online, offline, curriculum
hard_negative_ratio: 0.5
margin_threshold: 0.3
curriculum_warmup_epochs: 10
mining_refresh_epochs: 5

# V2: Auxiliary Tasks
auxiliary_tasks:
  - survival_rate
  - steps
aux_loss_weight: 0.3
aux_hidden_dim: 32
aux_loss_schedule: warmup  # constant, warmup, decay
aux_survival_weight: 1.0
aux_steps_weight: 0.01

# Loss function
loss_type: ranknet
margin: 0.1
sigma: 1.0
label_smoothing: 0.05
ranking_loss_weight: 1.0

# Regularization
l1_lambda: 0.001
weight_decay: 0.0001

# Training
batch_size: 128
gradient_accumulation_steps: 1
learning_rate: 0.001
warmup_epochs: 5
epochs: 100
early_stopping_patience: 100
num_workers: 6

# Checkpoint and logging
checkpoint_dir: checkpoints-ranking_v2-0111
log_dir: logs/ranking_v2

# Reproducibility
seed: 42

# Data Augmentation
augment_shift: true
augment_rotate90: true