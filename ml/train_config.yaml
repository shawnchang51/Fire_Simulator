# Fire Simulation Surrogate Model Training Configuration
# Usage: python -m ml.run_training --config ml/train_config.yaml

# =============================================================================
# Data Settings
# =============================================================================
data_dir: "combined_fast"
floor_plans_dir: "combined_fast/floor_plans"
max_plans: null

# =============================================================================
# Grid Processing
# =============================================================================
target_grid_size: [96, 128]
num_grid_channels: 4

# =============================================================================
# CNN Architecture
# =============================================================================
cnn_channels: [64, 128, 256, 512]
cnn_kernel_size: 3

# =============================================================================
# Scenario MLP
# =============================================================================
scenario_input_dim: 4
scenario_hidden_dims: [64, 32]

# =============================================================================
# Combined Head
# =============================================================================
head_hidden_dims: [512, 256, 128]
dropout: 0.15   # ⬅ 比 0.2 稍低，深模型更穩

# =============================================================================
# Output Configuration
# =============================================================================
num_outputs: 4
output_names:
  - survival_rate
  - avg_evacuation_time
  - steps
  - avg_fire_damage

# =============================================================================
# Training Hyperparameters
# =============================================================================
epochs: 100
batch_size: 128          # ⬅ 4090 建議
lr: 0.001                # ⬅ 當作 OneCycleLR 的 max_lr
weight_decay: 0.0001
patience: 10

# =============================================================================
# System Settings
# =============================================================================
num_workers: 8            # ⬅ 提高資料吞吐
device: null
checkpoint_dir: "checkpoints"

# =============================================================================
# Normalization Stats (optional, computed from training data if not provided)
# =============================================================================
# scenario_means: [100.0, 3.0, 0.5, 10.0]
# scenario_stds: [50.0, 1.5, 0.2, 5.0]
# target_means: [0.8, 50.0, 100.0, 0.3]
# target_stds: [0.2, 20.0, 50.0, 0.2]

# =============================================================================
# Evaluation Settings
# =============================================================================
eval_only: false
checkpoint: null